<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="../styles.css" />
  <style>html,body{overflow:visible} .sheet{width:var(--w);height:var(--h)}</style>
  <script>
    (function(){
      var q=new URLSearchParams(location.search);
      var st=document.createElement("style");
      st.textContent=":root{--w:"+(q.get("w")||390)+"px;--h:"+(q.get("h")||844)+"px}";
      document.head.appendChild(st);
    })();
  </script>
</head>
<body>

    <a id="link-b" href="#"></a>

  <script src="../dude.js"></script>
  <script src="fit-check.js"></script>

</html>
