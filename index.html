<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>a dude</title>
  <meta name="description" content="Click a button, get a doodle dude. Canvas 2D faces pinned to a 3D skull." />
  <meta property="og:title" content="a dude" />
  <meta property="og:description" content="Click a button, get a doodle dude." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://johnbr0phy.github.io/faces/" />
  <meta property="og:image" content="https://johnbr0phy.github.io/faces/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://johnbr0phy.github.io/faces/og.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="sheet">
    <span id="tally" class="sr">dude nº 1</span>
    <canvas id="page" aria-label="A doodle of a person"></canvas>
    <!-- Everything is drawn on the paper. These sit invisibly on top of where
         it is drawn, so the label is a real button and the credits are real
         links without anything being typeset. -->
    <button id="another" type="button" aria-label="another dude"></button>
    <a id="link-a" href="https://x.com/mannay/status/2087522034351796728" target="_blank" rel="noopener" aria-label="inspired by mannay"></a>
    <a id="link-b" href="https://x.com/johnbr0" target="_blank" rel="noopener" aria-label="ruined by @johnbr0"></a>
    <button id="move" type="button" aria-label="make him move"></button>
    <button id="motion" type="button" aria-label="give him something else to do"></button>
    <!-- A phone puts a home indicator over the bottom of the sheet. This is
         measured rather than guessed, and the footer is kept above it. -->
    <i id="safe" aria-hidden="true"></i>
  </main>
  <script src="dude.js"></script>
</body>
</html>
